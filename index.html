<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fran</title>
  <meta name="description" content="Tu plata en un solo lugar, separada en libros. Funciona sin conexión.">
  <meta name="theme-color" content="#13112B">
  <script src="js/tema.js"></script>

  <!-- Instalación como app en iPhone y Android -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fran">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono.svg">

  <!-- Estilos base y de cada pantalla -->
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/pantallas/inicio.css">
  <link rel="stylesheet" href="css/pantallas/clientes.css">
  <link rel="stylesheet" href="css/pantallas/prestamo.css">
  <link rel="stylesheet" href="css/pantallas/caja.css">
  <link rel="stylesheet" href="css/pantallas/agenda.css">
  <link rel="stylesheet" href="css/pantallas/ajustes.css">
  <link rel="stylesheet" href="css/pantallas/fran.css">
  <link rel="stylesheet" href="css/lila.css">
</head>
<body>
  <!-- Aquí dibuja cada pantalla -->
  <main id="pantalla" class="pantalla" aria-live="polite">
    <div class="cargando">
      <p>Cargando…</p>
    </div>
  </main>

  <!-- Barra de navegación inferior: cinco pestañas -->
  <nav class="barra-inferior" aria-label="Navegación principal">
    <a href="#/libro/personal" class="pestana" data-pestana="inicio">
      <svg class="pestana__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
      <span class="pestana__texto">Inicio</span>
    </a>
    <a href="#/libro/personal/graficos" class="pestana" data-pestana="graficos">
      <svg class="pestana__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2v11h11A11 11 0 1 1 11 2zm2 0a11 11 0 0 1 9 9h-9z"/></svg>
      <span class="pestana__texto">Gráficos</span>
    </a>
    <button type="button" class="pestana pestana--mas" id="boton-mas" aria-label="Agregar"><span>+</span></button>
    <a href="#/libro/personal/informes" class="pestana" data-pestana="informes">
      <svg class="pestana__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h14a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm3 5v2h8V7zm0 4v2h8v-2zm0 4v2h5v-2z"/></svg>
      <span class="pestana__texto">Informes</span>
    </a>
    <a href="#/ajustes" class="pestana" data-pestana="yo">
      <svg class="pestana__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>
      <span class="pestana__texto">Yo</span>
    </a>
  </nav>

  <!-- Arranque de la app: router, carga de pantallas y service worker -->
  <script type="module" src="js/app.js"></script>
  <noscript>
    <p class="aviso-noscript">Esta app necesita JavaScript activado para funcionar.</p>
  </noscript>
</body>
</html>
